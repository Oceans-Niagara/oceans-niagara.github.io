name: Update RAG Vector Database

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai pinecone-client requests beautifulsoup4

      - name: Run embedding script
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME: "orchestrator-docs"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python embed_scripts.py
