    body {
      display: flex;
      justify-content: center;
      align-items: center;

    .stealth-card {
      max-width: 600px;

      opacity: 0.75;
      line-height: 1.6;
      margin: 0 0 24px 0;
    }
    .stealth-footer {
      font-size: 0.85rem;
      opacity: 0.4;
      margin-top: 40px;

  <div class="stealth-card">
